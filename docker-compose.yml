services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    user: ${JELLYFIN_UID}:${JELLYFIN_GID}
    network_mode: 'host'
    volumes:
      - ./data/jellyfin/config:/config
      - ./data/jellyfin/cache:/cache
      - ${MUSIC_PATH}:/media/Music
      - ${MOVIES_PATH}:/media/Movies
      - ${TV_PATH}:/media/Tv_Shows
    restart: 'unless-stopped'
    environment:
      - ${JELLYFIN_PUBLISHED_URL}
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=${QBITTORENT_PUID}
      - PGID=${QBITTORENT_PGID}
      - TZ=${TZ}
      - WEBUI_PORT=${QBITTORENT_WEBUI_PORT}
      - TORRENTING_PORT=${QBITTORENT_TORRENTING_PORT}
    volumes:
      - ./data/qbittorrent/config:/config
      - ${DOWNLOADS_PATH}:/downloads
    ports:
      - "${QBITTORENT_WEBUI_PORT}:9090"
      - "${QBITTORENT_TORRENTING_PORT}:6881"
      - "${QBITTORENT_TORRENTING_PORT}:6881/udp"
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${SONARR_PUID}
      - PGID=${SONARR_PGID}
      - TZ=${TZ}
    volumes:
      - ./data/sonarr/config:/config
      - ${TV_PATH}:/tv
      - ${DOWNLOADS_PATH}:/downloads
    ports:
      - "${SONARR_PORT}:8989"
    restart: unless-stopped
    depends_on:
      - prowlarr
      - qbittorrent

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${RADARR_PUID}
      - PGID=${RADARR_PGID}
      - TZ=${TZ}
    volumes:
      - ./data/radarr/config:/config
      - ${MOVIES_PATH}:/movies
      - ${DOWNLOADS_PATH}:/downloads
    ports:
      - "${RADARR_PORT}:7878"
    restart: unless-stopped
    depends_on:
      - prowlarr
      - qbittorrent

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${SONARR_PUID}
      - PGID=${SONARR_PGID}
      - TZ=${TZ}
    volumes:
      - ./data/prowlarr/config:/config
    ports:
      - "${PROWLARR_PORT}:9696"
    restart: unless-stopped

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    environment:
      - PUID=${LIDARR_PUID}
      - PGID=${LIDARR_PGID}
      - TZ=${TZ}
    volumes:
      - ./data/lidarr/config:/config
      - ${MUSIC_PATH}:/music
      - ${DOWNLOADS_PATH}:/downloads
    ports:
      - "${LIDARR_PORT}:8686"
    restart: unless-stopped

  uptimekuma:
    image: louislam/uptime-kuma:latest
    volumes:
      - ./data/uptimekuma:/app/data
    container_name: uptime-kuma
    ports:
      - "${UPTIMEKUMA_PORT}:3001"
    restart: always

